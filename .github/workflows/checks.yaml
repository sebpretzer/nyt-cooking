name: checks
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            lint:
              - 'src/nyt_cooking/**'
              - 'tests/**'
              - '.pre-commit-config.yaml'
              - 'Makefile'
              - 'docs/**'
              - 'zensical.toml'
              - 'pyproject.toml'
              - 'uv.lock'
            test:
              - 'src/nyt_cooking/**'
              - 'tests/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'uv.lock'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GA_AUTO_COMMIT_PAT }}
      - name: Install uv, python, and dependencies
        run: make install-all

      - name: Run linting via pre-commit
        run: make lint
        id: lint
      - name: commit lint auto-fixes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        if: ${{ failure() && steps.lint.outcome == 'failure' && github.actor != 'renovate[bot]'}}
        with:
          commit_message: "lint auto-fixes"
      - name: commit lint auto-fixes for renovate[bot]
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        if: ${{ failure() && steps.lint.outcome == 'failure' && github.actor == 'renovate[bot]'}}
        with:
          commit_message: "lint auto-fixes"
          commit_user_name: "renovate[bot]"
          commit_user_email: "29139614+renovate[bot]@users.noreply.github.com"
          commit_author: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"

  test:
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv, python, and dependencies
        run: make install-all
      - name: Run tests
        run: make test
