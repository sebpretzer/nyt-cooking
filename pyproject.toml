[project]
name = "nyt-cooking"
version = "0.1.0"
description = "NYT Cooking Client and MCP server"
authors = [{ name = "Seb Pretzer", email = "quick.creek3304@fastmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13, <3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pydantic-settings>=2.13.1",
    "typer>=0.20.1",
]

[project.optional-dependencies]
mcp = ["fastmcp>=4,<5"]

[project.urls]
Repository = "https://github.com/sebpretzer/nyt-cooking"
Issues = "https://github.com/sebpretzer/nyt-cooking/issues"

[project.scripts]
nyt-cooking-mcp = "nyt_cooking.mcp.server:mcp.run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "griffe-pydantic>=1.0.0",
    "mkdocstrings[python]>=0.28.1",
    "pre-commit>=4.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.2",
    "ty>=0.0.11",
    "zensical>=0.0.60",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
preview = true
explicit-preview-rules = true
extend-select = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
external = ["DOC"]
ignore = ["COM812", "CPY001", "D100", "D104", "ISC001"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "DOC", "INP", "S101", "S311", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.flake8]
style = "google"
exclude = "tests/"
select = ["DOC", "PYD"]
ignore = [
    "DOC105",
    "DOC201",
    "DOC202",
    "DOC203",
    "DOC402",
    "DOC403",
    "DOC501",
    "DOC502",
    "DOC503",
]
per-file-ignores = [
    "src/nyt_cooking/client/models/*:DOC601,DOC603",
    "src/nyt_cooking/client/settings.py:DOC601,DOC603",
]
allow-init-docstring = true
ignore-private-args = true
skip-checking-short-docstrings = false

[tool.ty.environment]
python = ".venv"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
