[project]
site_name = "nyt-cooking"
site_url = "https://nyt-cooking.pretzer.io/"
repo_name = "sebpretzer/nyt-cooking"
repo_url = "https://github.com/sebpretzer/nyt-cooking"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "MCP" = [
      { "Install" = "guides/mcp/install.md" },
      { "Set up credentials" = "guides/mcp/credentials.md" },
      { "Search recipes" = "guides/mcp/search-recipes.md" },
      { "Manage your recipe box" = "guides/mcp/recipe-box.md" },
    ] },
    { "Python" = [
      { "Install" = "guides/python/install.md" },
      { "Set up credentials" = "guides/python/credentials.md" },
      { "Search recipes" = "guides/python/search-recipes.md" },
      { "Manage your recipe box" = "guides/python/recipe-box.md" },
    ] },
    { "Development" = [
      { "Contributing" = "CONTRIBUTING.md" },
    ] },
  ] },
  { "Reference" = [
    { "MCP" = "reference/mcp.md" },
    { "Client" = "reference/client.md" },
    { "Settings" = "reference/settings.md" },
    { "Models" = [
      { "Auth" = "reference/models/auth.md" },
      { "Base" = "reference/models/base.md" },
      { "Comments" = "reference/models/comments.md" },
      { "Folders" = "reference/models/folders.md" },
      { "Recipes" = "reference/models/recipes.md" },
      { "Search" = "reference/models/search.md" },
    ] },
    { "Development" = [
      { "Code of Conduct" = "CODE_OF_CONDUCT.md" },
    ] },
  ] },
]

[project.theme]
features = [
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "search.suggest",
  "content.code.copy",
]

[project.theme.icon]
logo = "lucide/chef-hat"
repo = "material/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = "#"

[project.plugins.autorefs]
resolve_closest = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.pydantic.dev/latest/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
merge_init_into_class = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_signature_annotations = true
separate_signature = true
inherited_members = true
summary = true
extensions = [{ griffe_pydantic = { schema = true } }]

[project.plugins.search]
